[package]
name = "mock-checkout"
description = "Local 4-mode checkout test site + /stats submission counter"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
# Test-only: drives the router in-process via `tower::ServiceExt::oneshot`
# instead of spawning a server and pulling in an HTTP client. `tower` is
# already in the dependency tree through axum; see AGENTS.md rule 5.
tower = { version = "0.5", features = ["util"] }
