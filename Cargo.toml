[workspace]
resolver = "2"
members = [
    "crates/broker",
    "crates/camofox-client",
    "crates/discord-gw",
    "crates/mock-checkout",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = true
